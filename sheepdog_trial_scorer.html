<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheepdog Trial Scorer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --text-primary:   #1a1a18;
    --text-secondary: #6b6b66;
    --bg-page:    #f5f3ee;
    --bg-surface: #ffffff;
    --bg-subtle:  #f0ede6;
    --border:     rgba(0,0,0,0.12);
    --border-mid: rgba(0,0,0,0.2);
    --green:  #3B6D11;
    --amber:  #BA7517;
    --red:    #A32D2D;
    --red-light: #FCEBEB;
    --red-border: #F09595;
    --radius-md: 8px;
    --radius-lg: 12px;
  }

  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 1.75rem;
    padding-bottom: 1.25rem;
    border-bottom: 0.5px solid var(--border);
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--text-primary);
    line-height: 1;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .scoring-guide-link {
    display: inline-block;
    margin-top: 10px;
    font-size: 13px;
    color: var(--green);
    text-decoration: none;
    border-bottom: 0.5px solid var(--green);
    opacity: 0.85;
  }
  .scoring-guide-link:hover { opacity: 1; }

  .disq-banner {
    display: none;
    background: var(--red-light);
    border: 0.5px solid var(--red-border);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    font-size: 15px;
    color: var(--red);
    font-weight: 600;
    text-align: center;
    margin-bottom: 1.25rem;
  }

  .score-card {
    background: var(--bg-surface);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .score-number {
    font-family: 'Playfair Display', serif;
    font-size: 96px;
    line-height: 1;
    font-weight: 700;
    transition: color 0.35s;
  }
  .score-high { color: var(--green); }
  .score-mid  { color: var(--amber); }
  .score-low  { color: var(--red); }

  .score-label {
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 6px;
    margin-bottom: 1.25rem;
  }

  .score-meta {
    display: flex;
    justify-content: center;
    gap: 2rem;
    border-top: 0.5px solid var(--border);
    padding-top: 1rem;
  }

  .meta-item { text-align: center; }
  .meta-value { font-size: 20px; font-weight: 600; color: var(--text-primary); }
  .meta-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

  .deduct-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    font-weight: 600;
    text-align: center;
    margin-bottom: 10px;
  }

  .deduct-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 10px;
  }

  .ded-btn {
    background: var(--bg-surface);
    border: 0.5px solid var(--border-mid);
    border-radius: var(--radius-md);
    padding: 16px 8px;
    cursor: pointer;
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--red);
    text-align: center;
    transition: background 0.1s, transform 0.1s;
    line-height: 1;
  }
  .ded-btn:hover { background: var(--red-light); }
  .ded-btn:active { transform: scale(0.94); }
  .ded-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .ded-btn .btn-sub {
    display: block;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 10px;
    color: var(--text-secondary);
    font-weight: 400;
    margin-top: 4px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .disq-btn {
    width: 100%;
    background: var(--bg-surface);
    border: 0.5px solid var(--red-border);
    border-radius: var(--radius-md);
    padding: 13px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--red);
    transition: background 0.1s;
    margin-bottom: 1.5rem;
  }
  .disq-btn:hover { background: var(--red-light); }
  .disq-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .actions {
    display: flex;
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  .action-btn {
    flex: 1;
    background: none;
    border: 0.5px solid var(--border-mid);
    border-radius: var(--radius-md);
    padding: 9px;
    font-family: inherit;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.15s;
  }
  .action-btn:hover { background: var(--bg-subtle); color: var(--text-primary); }
  .action-btn:disabled { opacity: 0.3; cursor: default; }

  .log-heading {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .log-list {
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    max-height: 200px;
    overflow-y: auto;
  }

  .log-empty {
    padding: 16px;
    font-size: 13px;
    color: var(--text-secondary);
    text-align: center;
  }

  .log-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 14px;
    font-size: 13px;
    border-bottom: 0.5px solid var(--border);
    background: var(--bg-surface);
  }
  .log-item:last-child { border-bottom: none; }
  .log-item:nth-child(even) { background: var(--bg-subtle); }
  .log-num { color: var(--text-secondary); min-width: 24px; font-size: 12px; }
  .log-pts { font-weight: 600; color: var(--red); }

  @media (max-width: 400px) {
    .score-number { font-size: 72px; }
    .ded-btn { font-size: 22px; padding: 14px 6px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>Sheepdog Trial Scorer</h1>
    <p class="subtitle">Australian ANKC/ASBCA — starts at 100 points</p>
    <a class="scoring-guide-link" href="#" target="_blank">View scoring guide →</a>
  </div>

  <div class="disq-banner" id="disq-banner">⚠ Disqualified — trial ended</div>

  <div class="score-card">
    <div class="score-number score-high" id="score-number">100</div>
    <div class="score-label">Current score</div>
    <div class="score-meta">
      <div class="meta-item">
        <div class="meta-value" id="stat-deducted">0</div>
        <div class="meta-label">Points deducted</div>
      </div>
      <div class="meta-item">
        <div class="meta-value" id="stat-faults">0</div>
        <div class="meta-label">Faults</div>
      </div>
    </div>
  </div>

  <p class="deduct-label">Deduct points</p>

  <div class="deduct-grid">
    <button class="ded-btn" onclick="deduct(1)">−1<span class="btn-sub">point</span></button>
    <button class="ded-btn" onclick="deduct(2)">−2<span class="btn-sub">points</span></button>
    <button class="ded-btn" onclick="deduct(3)">−3<span class="btn-sub">points</span></button>
    <button class="ded-btn" onclick="deduct(4)">−4<span class="btn-sub">points</span></button>
    <button class="ded-btn" onclick="deduct(5)">−5<span class="btn-sub">points</span></button>
  </div>

  <button class="disq-btn" id="disq-btn" onclick="disqualify()">Disqualify (DQ)</button>

  <div class="actions">
    <button class="action-btn" id="undo-btn" onclick="undoLast()" disabled>↩ Undo last</button>
    <button class="action-btn" onclick="resetTrial()">↺ New trial</button>
  </div>

  <p class="log-heading">Fault log</p>
  <div class="log-list" id="log-list">
    <div class="log-empty">No faults recorded yet</div>
  </div>

</div>
<script>
  let score = 100, totalDeducted = 0, faultCount = 0, log = [], disqualified = false;

  function updateDisplay() {
    const el = document.getElementById('score-number');
    el.textContent = Math.max(score, 0);
    el.className = 'score-number ' + (score >= 70 ? 'score-high' : score >= 40 ? 'score-mid' : 'score-low');
    document.getElementById('stat-deducted').textContent = totalDeducted;
    document.getElementById('stat-faults').textContent = faultCount;
    document.getElementById('undo-btn').disabled = log.length === 0;
  }

  function renderLog() {
    const list = document.getElementById('log-list');
    if (log.length === 0) {
      list.innerHTML = '<div class="log-empty">No faults recorded yet</div>';
      return;
    }
    list.innerHTML = '';
    [...log].reverse().forEach((entry, i) => {
      const num = log.length - i;
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = entry.dq
        ? `<span class="log-num">${num}</span><span style="flex:1">Disqualified</span><span class="log-pts">DQ</span>`
        : `<span class="log-num">${num}</span><span style="flex:1">Fault</span><span class="log-pts">−${entry.pts}</span>`;
      list.appendChild(div);
    });
  }

  function setDedButtons(disabled) {
    document.querySelectorAll('.ded-btn, .disq-btn').forEach(b => b.disabled = disabled);
  }

  function deduct(pts) {
    if (disqualified) return;
    score = Math.max(score - pts, 0);
    totalDeducted += pts;
    faultCount++;
    log.push({ pts, dq: false });
    updateDisplay();
    renderLog();
  }

  function disqualify() {
    if (disqualified) return;
    disqualified = true;
    log.push({ pts: 0, dq: true });
    document.getElementById('disq-banner').style.display = 'block';
    setDedButtons(true);
    updateDisplay();
    renderLog();
  }

  function undoLast() {
    if (log.length === 0) return;
    const last = log.pop();
    if (last.dq) {
      disqualified = false;
      document.getElementById('disq-banner').style.display = 'none';
      setDedButtons(false);
    } else {
      score += last.pts;
      totalDeducted -= last.pts;
      faultCount--;
    }
    updateDisplay();
    renderLog();
  }

  function resetTrial() {
    score = 100; totalDeducted = 0; faultCount = 0; log = []; disqualified = false;
    document.getElementById('disq-banner').style.display = 'none';
    setDedButtons(false);
    updateDisplay();
    renderLog();
  }
</script>
</body>
</html>
